[project]
name = "disband"
version = "0.1.1"
description = "Python client for the Disband stem separation API"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
keywords = ["stem separation", "vocal remover", "audio", "music", "api"]
classifiers = [
    "Framework :: AnyIO",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Sound/Audio",
    "Typing :: Typed",
]
dependencies = [
    "anyio>=4.10,<5",
    "httpx2>=2.16,<3",
    # 2.7 reads attribute docstrings as field descriptions
    "pydantic>=2.7,<3",
]

[project.urls]
Homepage = "https://disband.io/docs"
Repository = "https://github.com/disbandio/disband-python"

[build-system]
requires = ["uv_build>=0.12.24,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "anyio>=4.11",
    "basedpyright>=1.40.2",
    "pytest>=9.2.0",
    "ruff>=0.17.6",
    "setuptools>=84.2.1",
    "standardwebhooks>=1.3.0",
    "unasync>=0.6.0",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
extend-select = ["I", "UP", "B", "A", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# a generated loop over a page, where the async source can't use yield from
"**/_sync/*" = ["UP028"]

[tool.basedpyright]
typeCheckingMode = "strict"
pythonVersion = "3.11"
venvPath = "."
venv = ".venv"
include = ["src", "tests", "scripts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# the async tests run without a marker, which their generated sync copies would carry too
anyio_mode = "auto"
