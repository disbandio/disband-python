name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # the oldest and newest supported, the oldest on the lowest versions the dependencies allow
        include:
          - python: "3.11"
            resolution: lowest-direct
          - python: "3.15"
            resolution: highest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --resolution ${{ matrix.resolution }}
      - run: uv run python scripts/generate.py
      # the generated sync client must match its async source
      - run: git diff --exit-code
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run basedpyright
      - run: uv run pytest -q
      - run: uv build
